# Konfiguracja Render (Blueprint) dla strony AIVELLY.
# Typ: statyczna strona (darmowa, bez usypiania – serwowana z CDN Render).
# Dokumentacja: https://render.com/docs/yaml-spec
services:
  - type: web
    runtime: static
    name: aivelly
    # Nie ma nic do kompilowania – "build" tylko sprawdza linki i brak sekretów.
    # Jeśli sprawdzenie się nie powiedzie, Render nie opublikuje zepsutej wersji.
    buildCommand: npm run build
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
